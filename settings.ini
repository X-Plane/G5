; Garmin G5 user settings
; Edit with any text editor, then reload the aircraft (or restart X-Plane).
; Format: key = value ; comment. Upper/lower case does not matter.
; A missing file or key uses the default shown here; a wrong value is reported
; in Log.txt ("[G5 XLua2] settings.ini: ...") and the default is used.
; Aircraft-specific settings (V-speeds, power bus, 3D screen, clicks) are in
; config.ini and are meant for the aircraft author.
;
; Two G5s: unit 1 is 3D/G5.obj, unit 2 is 3D/G5_2.obj (units = 2 in config.ini).
; Give each unit its own page so they do not show the same thing.

[Power]
; Power state at start. on = the G5 turns on by itself whenever aircraft power is
; available (real G5 behaviour). off = it stays off until its power button is pressed.
unit1_power = on ; on | off
unit2_power = on ; on | off

[Page]
; Page shown after the G5 boots.
unit1_page = AI ; AI = attitude indicator (PFD) | HSI = horizontal situation indicator
unit2_page = HSI ; AI | HSI

[Units]
; Display units. imperial = KT, FT, inHg (29.92), deg F
;                metric   = km/h, FT, hPa (1013), deg C
; Altitude is always shown in feet. The speed unit applies to the whole airspeed
; display: tape, colour bands, V-speeds, readout, TAS, GS and selected speed.
units = imperial ; imperial | metric
; Optional: override one unit of the preset above (leave empty to use the preset).
speed_unit = ; kt | mph | kmh
baro_unit = ; inhg | hpa
temp_unit = ; f | c
