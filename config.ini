; Garmin G5 (xLua 2.0 / Panel Graphics) - per-aircraft configuration
; Lines: key = value. ';' or '#' start a comment. Unknown keys are ignored.
; The user settings (power at start, page, units) are in settings.ini.

[System]
; sim/cockpit2/electrical/bus_volts index that feeds the G5, and the minimum volts
power_bus = 0
power_min_volts = 10
; Automatic Power Off when aircraft power is lost (Installation Manual battery page):
;   on_ground = "External Power Lost" countdown on the ground only; in the air the
;               unit goes to its battery by itself (message only)   [default]
;   always    = countdown in the air too;   never = always continue on battery
auto_power_off = on_ground
; countdown before the unit shuts down on its own (s; Maintenance Manual 3: 45 s)
power_lost_countdown_s = 45
; hold the power button this long to turn the unit off (manual: 5 s)
power_off_hold_s = 5
; boot logo (s): fades in 0.5 s, fades out over its last 0.5 s (real unit)
boot_logo_s = 2.0
shutdown_fade_s = 0.4
; 1 = magnetometer is on aircraft power: no magnetic heading when external power is lost
magnetometer_on_bus = 1

[Power-up and AHRS]
; after the boot logo: "ALIGNING / KEEP WINGS LEVEL" for att_kwl_s (no attitude; only
; counts down with the wings within 10 deg of level; 0 = power-up goes straight to
; "ALIGNING", the manuals only describe keep-wings-level for an in-flight AHRS reset),
; then "ALIGNING" with the attitude shown for align_s (s)
att_kwl_s = 0
; keep-wings-level time after an AHRS fault clears (laminar/g5/fail[0], fail_ahrs, back to 0)
att_kwl_recover_s = 10
align_s = 11
; red X on the air data, heading and the G5's own GPS until they are ready (s).
; Real unit (2026-07-20): no red-X step at power-up (air data and heading 0);
; the PFD heading tape stays hidden while ALIGNING instead
air_init_s = 0
hdg_init_s = 0
gps_init_s = 20

[Sensors]
; 1 = GMU 11 magnetometer installed (heading); 0 = ground track only
magnetometer = 1
; GPS for ground speed / track: the G5's own receiver and/or the navigator's position
gps_internal = 1
gps_external = 1
; navigator interface named in "Not receiving ... data": arinc | rs232. arinc = the
; navigators' data through the GAD 29 (its power: gad_bus); rs232 = GPS on RS-232
; only: the HSI's GPS scale word is always "VFR" (Pilot's Guide p.26 note)
nav_interface = arinc
; navigators configured: 2 = source names carry the number (GPS1, VOR2), 1 = plain GPS / VOR / LOC
nav_count = 2
; HSI page enabled (off on an attitude-only installation)
hsi_page = 1
; back to the PFD page from the HSI page in an unusual attitude (bank > 60, pitch > +30 / < -20)
unusual_revert = 1
; HSI wind box (needs show_oat: the GAD 13 provides OAT / TAS / winds)
show_wind = 1

[Failures]
; X-Plane failures that fail a sensor or system outside the G5 (failure value 6 =
; inoperative). Comma-separated dataref names; a bare name means
; sim/operation/failures/<name>. Empty = none. The G5's own faults are one
; int array per unit, laminar/g5[_2]/fail (1 = failed). Each fault below is
; the [?] element of that array:
;   fail_ahrs = [0]   fail_airdata = [1]   fail_gps_rx = [2]
;   fail_battery = [3]   fail_no_batt = [4]   fail_charger = [5]
;   fail_overtemp = [6]   fail_hardware = [7]   fail_power_supply = [8]
;   fail_display = [9]   fail_mag_uncal = [10]   fail_mag_db = [11]
;   fail_sw_mismatch = [12]   fail_net_conflict = [13]   fail_comm_error = [14]
;   fail_factory_cal = [15]   fail_a429_cfg = [16]   fail_afcs_key_stuck = [17]
;   fail_afcs_audio_db = [18]   fail_servo_clutch = [19]   fail_servo_trim_input = [20]
;   fail_gad29 = [21]: GAD 29 failed (no ARINC 429 navigation data: GPS scale word
;                "VFR" in yellow, GPSS yellow; also on a gad_bus power loss)
;   fail_mag_degraded = [22]: magnetic heading valid but maybe outside its accuracy
;                limits: heading digits yellow (Pilot's Guide 1.4.1.2)
ext_fail_mag = rel_g_magmtr
ext_fail_gps = rel_gps
ext_fail_nav1 = rel_nav1, rel_navcom1
ext_fail_nav2 = rel_nav2, rel_navcom2
ext_fail_oat = rel_g_oat
; the G5 has its own AHRS and air data sensors; map X-Plane failures here only if
; they should also fail the G5 (a G5 fails its own sensors through laminar/g5/fail[0] / [1])
ext_fail_ahrs =
ext_fail_airdata =
; the G5's own GPS receiver (gps_internal = 1) and "magnetic heading accuracy
; degraded" (yellow heading digits, Pilot's Guide 1.4.1.2) have no X-Plane failure
; of their own: X-Plane's failures are all-or-nothing, there is no "degraded".
; Map a failure dataref here if your aircraft has one, or let your plugin write the
; fault array directly:
;   laminar/g5/fail[2] = 1    internal GPS receiver failed     (unit 2: laminar/g5_2/fail)
;   laminar/g5/fail[22] = 1   magnetic heading accuracy degraded
; "___" in the heading box (Pilot's Guide / AFMS 3-1) needs heading AND track
; failed: ext_fail_mag (rel_g_magmtr) plus every GPS source this unit has, i.e.
; ext_fail_gps (rel_gps) and, with gps_internal = 1, the receiver above.
ext_fail_gps_rx =
ext_fail_mag_degraded =
; every laminar/g5[_2]/fail element is writable (1 = failed, 0 = working): a
; plugin can read and write them; there are no failure commands

[Battery]
; 1 = battery installed (required on the attitude unit, optional on an HSI)
battery_installed = 1
; status box top-left: on_battery (manual default "When Using Battery") | always
show_battery = on_battery
; energy (Wh) and draw: electronics + backlight term x screen brightness (W).
; 6.8 Wh at ~1.7 W (lowest backlight) gives the "up to 4 hours" of the manuals;
; daylight / full brightness ~2 h. battery_health scales the capacity (aged pack).
battery_wh = 6.8
battery_health = 1.0
power_base_w = 1.6
power_backlight_w = 1.6
; charge used on the very first start (afterwards the charge is kept in state_unit<n>.ini)
battery_initial_pct = 95
; charging: constant current at battery_charge_c x capacity per hour up to
; battery_cv_pct, then tapering; charger efficiency (bus side)
battery_charge_c = 0.6
battery_cv_pct = 80
battery_charge_eff = 0.85
; battery temperature follows OAT + offset (panel), time constant (s)
battery_temp_offset = 15
battery_temp_tau_s = 1200
; no battery operation outside -20..+60 C (Installation Manual 4); no charging outside
battery_op_temp_min = -20
battery_op_temp_max = 60
battery_charge_temp_min = 0
battery_charge_temp_max = 45
; "Low battery" message below this %; the unit shuts down at battery_cutoff_pct
battery_low_pct = 20
battery_cutoff_pct = 1
; "Critical battery fault! Powering off" shows this long before the unit goes off
critical_batt_s = 3
; add the units' current to X-Plane's bus load (plugin_bus_load_amps)
bus_load = 1
; buses (-1 = not modelled): the GMU 11 breaker (with an HSI: the HSI's bus;
; -1 = each unit's own bus) and the GAD breaker that feeds the GAD 13 (OAT / TAS / winds)
; and the GAD 29 (ARINC 429 navigation data, see nav_interface)
magnetometer_bus = -1
gad_bus = -1
; per-unit overrides: unit1_<key> / unit2_<key> = value for power_bus,
; battery_installed, show_battery, auto_power_off, gps_internal, backlight_auto_initial,
; backlight_initial, backlight_max, backlight_filter_s, photocell_min, photocell_max, battery_wh,
; battery_health, battery_initial_pct, unusual_revert, hsi_page, role. Unit 2 defaults
; to gps_internal = 0 (real dual installations: GPS from unit 1 over CAN).
; Example: unit2_power_bus = 1

[Backlight]
backlight_initial = 0.78
; default backlight mode at every power-up: 1 = Auto (photocell, real unit), 0 = manual at backlight_initial
backlight_auto_initial = 1
backlight_min = 0.05
; Maximum Display Brightness (configuration mode Backlight page): the backlight
; never goes above it, in Auto (bright light) or with the knob. 1.0 = 100 % (default,
; no cap). Not below backlight_min.
backlight_max = 1.0
; Filter Time Constant (Backlight page), seconds of sim time: in Auto the photocell
; (X-Plane's ambient level) goes through a first-order filter with this time
; constant, so the screen follows a change of light smoothly and late. 0 = none
; (default: follows the light at once).
backlight_filter_s = 0
; Minimum / Maximum Photocell Input (Backlight page): the two ends of the Auto curve on the
; photocell axis, in % of the photocell reading (X-Plane's ambient level ^ 0.25: about 39 %
; at night, 100 % in daylight; the Backlight page shows the live reading). At or below the
; minimum the Auto level sits at backlight_neutral, at or above the maximum at 100 % (then
; capped by backlight_max), straight in between. 0 and 100 (default; "Default" in the
; Installation Manual tables) = the plain curve. The manuals give no range or units: the
; two stay at least 5 apart (minimum 0..95, maximum 5..100).
photocell_min = 0
photocell_max = 100
; Screen brightness adapts to the light: X-Plane's ambient (readable, no glare)
; level is used at backlight_neutral, and every backlight_doubling of backlight
; above / below doubles / halves it (Auto = neutral). ambient_min = the lowest
; base level at night (ratio of the OBJ nits).
backlight_neutral = 0.78
backlight_doubling = 0.2
ambient_min = 0.002
; instrument_brightness_ratio index mirrored from the G5 backlight (-1 = none).
; The old 3D-panel G5 used knob #6. Only the acting master writes it: once
; when the aircraft loads, then only while it shows the PFD or HSI page and
; only when the value changes. While no unit is up (off, booting,
; configuration mode, hardware failure) the index is left alone, so the
; panel's own knob is not overwritten.
brightness_rheostat = 6

[PFD]
; V-speed references (knots, shown in the settings.ini speed unit). 0 = the
; aircraft's own (.acf: Vx, Vy, Va, Vbg best glide). A value that is missing,
; 0 or negative, below VSO / 20 kt or above VNE has no marker.
vx = 0
vy = 0
va = 0
vg = 0
; airspeed tape: lowest speed shown (display unit; Pilot's Guide: indication starts at
; 30 kt), below it the readout shows dashes and the V-speeds are listed at the bottom
speed_tape_min = 30
; lowest speed the tape moves to (display unit): below it the tape stands still
; with this speed at the pointer (real unit: 20, so "30" sits just above it)
speed_tape_floor = 20
; hysteresis before falling back below speed_tape_min
speed_alive_hyst = 2
; speed_tape_range is not used: the tape is fixed at 4 px per knot (baked art)
speed_tape_range = 60
; attitude pitch offset (deg, PFD menu "Pitch"; the unit writes changes here)
pitch_offset = 0
; airspeed trend vector look-ahead (s)
speed_trend_s = 6
; pixels per pitch degree of the horizon and the ladder (default 3.6 = the artwork's scale;
; the unusual-attitude chevrons and ladder labels are not rescaled)
pitch_px_per_deg = 3.6
; Pitch Display (configuration mode Attitude page, also set there):
;   normal   = 3.6 px / deg, "10" labels (every Installation Manual table)   [default]
;   expanded = about 7.4 px / deg, "5" / "10" labels (Pilot's Guide figures 2-5 / 2-6;
;              "expanded" is our name, the manuals do not name this option)
pitch_display = normal
; VSI range (the real unit's Air Data configuration, Installation Manual
; 6.3.6; also in configuration mode): 15 = +/-1500 fpm (default),
; 30 = +/-3000 fpm. Other values are not valid and fall back to 15.
vsi_scale = 15
show_tas = 1
show_oat = 1
; density altitude above the baro box while there is no airspeed (needs show_oat)
show_density_alt = 1
show_gs = 1
; selected-heading box on the PFD (old artwork; the real unit shows the bug on the tape only)
show_hdg_box = 0
; Heading Bug Auto Sync Mode (Pilot's Guide Rev M 3.3.5.2.1: "if configured"). 1 = Menu >
; Heading > press and hold the Selection Knob (autopilot engaged, lateral mode GPS / VOR / LOC /
; BC) keeps the heading bug on the aircraft heading until you turn it, the autopilot goes off or
; the lateral mode is no longer a navigation mode. 0 = off (default): the knob hold syncs once.
; Also a row on the configuration page Flight Controls.
hdg_sync = 0
; roll scale: ground = arc turns with the horizon, fixed pointer (Garmin default)
;             sky    = fixed arc, pointer turns with the horizon
roll_pointer = ground
; green standard-rate (3 deg/s) bank triangles on the roll arc, from TAS
std_turn_ref = 1
; old-unit behaviour: with FD/AP on, the PFD moves down 14 px and the AP annunciator bar shows
show_ap_bar = 1
; with a GFC 500 (laminar/gfc500/installed) the status box stays as an empty bar
; when AP and FD are off (Pilot's Guide figure 3-25); 0 = hide it like other autopilots
ap_bar_reserved = 1
; GFC 500 preflight test: "PFT" in the AP field for this long after power-up (s)
afcs_pft_s = 5
; flight director: single (V-bar command bars) | dual (cross bars, L-shaped symbol)
fd_cue = single

[HSI]
; bearing pointer sources: 0 = off, 1 = GPS, 2 = NAV1, 3 = NAV2
bearing1_source = 0
bearing2_source = 0
; HSI Setup page (also changed on the unit, which writes the new value here):
; Wind Vector off | speed_dir | head_xwind, HSI Size normal | expanded
wind_vector = speed_dir
hsi_size = normal

[Display]
; framebuffer scale. 1 = the G5's native 320x240, artwork 1:1
screen_scale = 1
; 3D device framebuffer = the whole 2048x1024 G5 texture (1:1 pixels); the 320x240
; content is drawn at the screen UV island, px x 1032..1352, y 8..248 from the top
; (must match the screen UV island of the G5 model)
screen_fb_w = 2048
screen_fb_h = 1024
screen_origin_x = 1032
screen_origin_y = 776
enable_popup = 1
popup_initial = 0
; TTF placeholders for the few texts without artwork (X-Plane root relative)
font_bold = Resources/fonts/Roboto-Bold.ttf
font_cond = Resources/fonts/RobotoCondensed-Regular.ttf
; 1 = draw a 320x240 alignment grid instead of the instrument; 2 = diagnostic: the whole framebuffer with quadrant colours and coordinates
test_pattern = 0
; LCD column lines drawn over the 3D screen image (they dim with the image and
; disappear when the screen is off): line darkness 0..1 (0 = off), every N pixels
lcd_lines = 0.15
lcd_period = 3

[Clicks]
; X-Plane only clicks manipulators of the aircraft's ONE cockpit object; G5.obj is
; attached as an ordinary object so the host keeps its own cockpit object. The
; plugin therefore picks the knob and power button itself (3D cockpit view).
; 0 = off, 1 = auto (off for a G5.obj slot that X-Plane can already click: the
; slot is the cockpit object, or the model already has the click manipulators), 2 = always
pick_mode = 1
; a click inside the knob/button rectangle that misses the knob: 0 = swallow, 1 = pass to X-Plane
pick_pass_misses = 0
; 1 = log the click windows and hits to Log.txt
pick_debug = 0

[Installation]
; number of G5 units: auto (default) = what the .acf attaches: 3D/G5.obj is
; unit 1, 3D/G5_2.obj (a second G5 below) is unit 2. 1 / 2 = fixed. Unit 2
; uses laminar_g5_2 and laminar/g5_2/... for its screen device, commands and
; datarefs.
units = auto
; master / slave: 0 = master, 1 = slave. With two G5s the attitude unit (1)
; is the master and the HSI unit (2) a slave: it uses the master's sensor
; data (attitude, air data, GPS, magnetometer, OAT) while the master's item is
; valid and its own otherwise. With no master up (not installed, off,
; failed, or both set to 1) the first G5 that is up takes over as master.
unit1_role = 0
unit2_role = 1
; Automatic Declutter (unusual_revert: back to the PFD page in an unusual
; attitude) per unit: the attitude unit on, the HSI unit off (Installation
; Manual dual tables)
unit2_unusual_revert = 0
; GFC 500: auto = read laminar/gfc500/installed (GFC500.System writes 1
; into it every frame); 0 / 1 = fixed
gfc500 = auto

[Configuration mode]
; Hold the knob while the unit powers up (or command laminar/g5/config_mode).
; Values changed there are saved in state_unit<n>.ini next to the scripts and
; override this file and settings.ini; delete that file to go back to these.
; Airspeed page, knots. Band limits 0 = the aircraft's own (acf):
vne = 0
vno = 0
vso = 0
vs1 = 0
vfe = 0
; V-speed flag R (0 = not shown); red VMC line, blue VYSE line (0 = the
; aircraft's own, not shown when out of range like the references above)
vr = 0
vmc = 0
vyse = 0
; ground speed unit: -1 = same as airspeed, 0 kt, 1 mph, 2 km/h
gs_unit = -1
; Units page: altitude 0 = feet (default), 1 = meters (tape, readout, selected
; altitude, ALT reference, density altitude; the knob steps 50 m); vertical speed
; 0 = ft/min (default), 1 = m/s (VSI scale +/-8 or +/-15 m/s with vsi_scale 15 / 30,
; VS reference "+2.5"). Alerting thresholds stay 1000 / 200 ft (305 / 61 m).
alt_unit = 0
vs_unit = 0
; attitude calibration (deg); the unit shows X-Plane's pitch / roll + these
pitch_cal = 0
roll_cal = 0
; 0 = no CDI / VDI (mechanical CDI / HSI on the navigator)
nav_data = 1
; Selected Course (Navigation page; Installation Manual: "Disabled" if a mechanical CDI or HSI is
; connected to the navigator, otherwise "Enabled"). 1 = Enabled (default): the menus have the
; Course / OBS item and the knob sets the course (the G5 writes X-Plane's hsi_obs). 0 =
; Disabled: no Course / OBS item, the G5 never writes the course (it still shows the HSI's).
selected_course = 1
; VNAV Deviation Scale (Navigation page): full scale of the VNAV chevron on the VDI,
; ft at the outer dot: 500 | 1000. Fed by X-Plane's fms_vtk_pilot
vnav_dev_scale = 500
; vibration test: RMS acceleration (g) that is 100 % of the limit
vib_limit_g = 0.3

[Autopilot option]
; One of the two, as on a real G5 (ESP needs a Garmin autopilot; the GPSS item is never
; shown with one):
;   esp  = Electronic Stability & Protection (Pilot's Guide 3.5): ESP tile in
;          the PFD menu, Roll Limit Indicators, "ESP OFF". The ESP itself
;          (arming, limits, forces) is the AFCS_ESP package's, with its own
;          config.ini; without that package the G5 shows no ESP.
;   gpss = GPS steering for an analog autopilot (Pilot's Guide 4.1): GPSS tile
;          in the menus, GPSS box; off hands the autopilot back to HDG
;   none = neither
ap_option = esp
