; Garmin G5 (xLua 2.0 / Panel Graphics) - per-aircraft configuration
; Lines: key = value. ';' or '#' start a comment. Unknown keys are ignored.
; The user settings (power at start, page, units) are in settings.ini.

[System]
; sim/cockpit2/electrical/bus_volts index that feeds the G5, and the minimum volts
power_bus = 0
power_min_volts = 10
; Automatic Power Off when aircraft power is lost (Installation Manual battery page):
;   on_ground = "External Power Lost" countdown on the ground only; in the air the
;               unit goes to its battery by itself (message only)   [default]
;   always    = countdown in the air too;   never = always continue on battery
auto_power_off = on_ground
; countdown before the unit shuts down on its own (s; Maintenance Manual 3: 45 s)
power_lost_countdown_s = 45
; hold the power button this long to turn the unit off (manual: 5 s)
power_off_hold_s = 5
; boot logo (s)
boot_logo_s = 1.0
shutdown_fade_s = 0.4
; 1 = magnetometer is on aircraft power: no magnetic heading when external power is lost
magnetometer_on_bus = 1

[Power-up and AHRS]
; after the boot logo: "ALIGNING / KEEP WINGS LEVEL" for att_kwl_s (no attitude; only
; counts down with the wings within 10 deg of level; 0 = power-up goes straight to
; "ALIGNING", the manuals only describe keep-wings-level for an in-flight AHRS reset),
; then "ALIGNING" with the attitude shown for align_s (s)
att_kwl_s = 0
; keep-wings-level time after an AHRS fault clears (laminar/g5/fail_ahrs back to 0)
att_kwl_recover_s = 10
align_s = 40
; red X on the air data, heading and the G5's own GPS until they are ready (s)
air_init_s = 3
hdg_init_s = 5
gps_init_s = 20

[Sensors]
; 1 = GMU 11 magnetometer installed (heading); 0 = ground track only
magnetometer = 1
; GPS for ground speed / track: the G5's own receiver and/or the navigator's position
gps_internal = 1
gps_external = 1
; navigator interface named in "Not receiving ... data": arinc | rs232
nav_interface = arinc
; navigators configured: 2 = source names carry the number (GPS1, VOR2), 1 = plain GPS / VOR / LOC
nav_count = 2
; menu items: GPSS (analog autopilot interface with GPS steering; never with a GFC 500),
; HSI page enabled (off on an attitude-only installation)
gpss_menu = 1
hsi_page = 1
; back to the PFD page from the HSI page in an unusual attitude (bank > 60, pitch > +30 / < -20)
unusual_revert = 1
; HSI wind box (needs show_oat: the GAD 13 provides OAT / TAS / winds)
show_wind = 1

[Failures]
; X-Plane failures that fail a sensor or system outside the G5 (failure value 6 =
; inoperative). Comma-separated dataref names; a bare name means
; sim/operation/failures/<name>. Empty = none. The G5's own faults are the
; per-unit datarefs laminar/g5[_2]/fail_ahrs, fail_airdata, fail_gps_rx,
; fail_battery, fail_charger, fail_overtemp, fail_hardware, fail_display (1 = failed)
; and the commands laminar/g5[_2]/fail_<name>_toggle.
ext_fail_mag = rel_g_magmtr
ext_fail_gps = rel_gps
ext_fail_nav1 = rel_nav1, rel_navcom1
ext_fail_nav2 = rel_nav2, rel_navcom2
ext_fail_oat = rel_g_oat
; the G5 has its own AHRS and air data sensors; map X-Plane failures here only if
; they should also fail the G5 (see note.md 2026-10-14)
ext_fail_ahrs =
ext_fail_airdata =

[Battery]
; 1 = battery installed (required on the attitude unit, optional on an HSI)
battery_installed = 1
; status box top-left: on_battery (manual default "When Using Battery") | always
show_battery = on_battery
; energy (Wh) and draw: electronics + backlight term x screen brightness (W).
; 6.8 Wh at ~1.7 W (lowest backlight) gives the "up to 4 hours" of the manuals;
; daylight / full brightness ~2 h. battery_health scales the capacity (aged pack).
battery_wh = 6.8
battery_health = 1.0
power_base_w = 1.6
power_backlight_w = 1.6
; charge used on the very first start (afterwards the charge is kept in state_unit<n>.ini)
battery_initial_pct = 95
; charging: constant current at battery_charge_c x capacity per hour up to
; battery_cv_pct, then tapering; charger efficiency (bus side)
battery_charge_c = 0.6
battery_cv_pct = 80
battery_charge_eff = 0.85
; battery temperature follows OAT + offset (panel), time constant (s)
battery_temp_offset = 15
battery_temp_tau_s = 1200
; no battery operation outside -20..+60 C (Installation Manual 4); no charging outside
battery_op_temp_min = -20
battery_op_temp_max = 60
battery_charge_temp_min = 0
battery_charge_temp_max = 45
; "Low battery" message below this %; the unit shuts down at battery_cutoff_pct
battery_low_pct = 20
battery_cutoff_pct = 1
; "Critical battery fault! Powering off" shows this long before the unit goes off
critical_batt_s = 3
; add the units' current to X-Plane's bus load (plugin_bus_load_amps)
bus_load = 1
; buses (-1 = not modelled): the GMU 11 breaker (with an HSI: the HSI's bus;
; -1 = each unit's own bus) and the GAD breaker that feeds the GAD 13 (OAT / TAS / winds)
magnetometer_bus = -1
gad_bus = -1
; per-unit overrides: unit1_<key> / unit2_<key> = value for power_bus,
; battery_installed, show_battery, auto_power_off, gps_internal, backlight_auto_initial,
; backlight_initial, battery_wh, battery_health, battery_initial_pct. Unit 2 defaults
; to gps_internal = 0 (real dual installations: GPS from unit 1 over CAN).
; Example: unit2_power_bus = 1

[Backlight]
backlight_initial = 0.78
; default backlight mode at every power-up: 1 = Auto (photocell, real unit), 0 = manual at backlight_initial
backlight_auto_initial = 1
backlight_min = 0.05
; Screen brightness adapts to the light: X-Plane's ambient (readable, no glare)
; level is used at backlight_neutral, and every backlight_doubling of backlight
; above / below doubles / halves it (Auto = neutral). ambient_min = the lowest
; base level at night (ratio of the OBJ nits).
backlight_neutral = 0.78
backlight_doubling = 0.2
ambient_min = 0.002
; instrument_brightness_ratio index mirrored from the G5 backlight (-1 = none).
; The old 3D-panel G5 used knob #6.
brightness_rheostat = 6

[PFD]
; V-speed references (knots, 0 = hidden; shown in the settings.ini speed unit)
vx = 30
vy = 50
va = 60
vg = 40
; airspeed tape: lowest speed shown (display unit; Pilot's Guide: indication starts at
; 30 kt), below it the readout shows dashes and the V-speeds are listed at the bottom;
; hysteresis before falling back below it; knots visible on the tape
speed_tape_min = 30
speed_alive_hyst = 2
speed_tape_range = 60
; airspeed trend vector look-ahead (s)
speed_trend_s = 6
; px per pitch degree (the ArtHori_Words ladder is drawn at 3.6)
pitch_px_per_deg = 3.6
; VSI scale artwork: 30 = VS_30config (+/-3000 fpm), 15 = VS_15config (+/-1500 fpm)
vsi_scale = 30
show_tas = 1
show_oat = 1
; density altitude above the baro box while there is no airspeed (needs show_oat)
show_density_alt = 1
show_gs = 1
; selected-heading box on the PFD (old artwork; the real unit shows the bug on the tape only)
show_hdg_box = 0
; roll scale: ground = arc turns with the horizon, fixed pointer (Garmin default)
;             sky    = fixed arc, pointer turns with the horizon
roll_pointer = ground
; green standard-rate (3 deg/s) bank triangles on the roll arc, from TAS
std_turn_ref = 1
; old-unit behaviour: with FD/AP on, the PFD moves down 14 px and the AP annunciator bar shows
show_ap_bar = 1
; with a GFC 500 (laminar/gfc500/installed) the status box stays as an empty bar
; when AP and FD are off (Pilot's Guide figure 3-25); 0 = hide it like other autopilots
ap_bar_reserved = 1
; GFC 500 preflight test: "PFT" in the AP field for this long after power-up (s)
afcs_pft_s = 5
; flight director: single (V-bar command bars) | dual (cross bars, L-shaped symbol)
fd_cue = single

[HSI]
; bearing pointer sources: 0 = off, 1 = GPS, 2 = NAV1, 3 = NAV2
bearing1_source = 0
bearing2_source = 0

[Display]
; framebuffer scale. 1 = the G5's native 320x240, artwork 1:1
screen_scale = 1
; 3D device framebuffer = the whole 2048x1024 G5 texture (1:1 pixels); the 320x240
; content is drawn at the screen UV island, px x 1032..1352, y 8..248 from the top
; (must match tools/blender/uv_screen_1to1.py and build_g5_obj.py SCREEN_UV)
screen_fb_w = 2048
screen_fb_h = 1024
screen_origin_x = 1032
screen_origin_y = 776
enable_popup = 1
popup_initial = 0
; TTF placeholders for the few texts without artwork (X-Plane root relative)
font_bold = Resources/fonts/Roboto-Bold.ttf
font_cond = Resources/fonts/RobotoCondensed-Regular.ttf
; 1 = draw a 320x240 alignment grid instead of the instrument
test_pattern = 0
; LCD column lines drawn over the 3D screen image (they dim with the image and
; disappear when the screen is off): line darkness 0..1 (0 = off), every N pixels
lcd_lines = 0.15
lcd_period = 3

[Clicks]
; X-Plane only clicks manipulators of the aircraft's ONE cockpit object; G5.obj is
; attached as an ordinary object so the host keeps its own cockpit object. The
; plugin therefore picks the knob and power button itself (3D cockpit view).
; 0 = off, 1 = auto (off for a G5.obj slot that X-Plane can already click: the
; slot is the cockpit object, or tools/inject_g5_clicks.py was run), 2 = always
pick_mode = 1
; a click inside the knob/button rectangle that misses the knob: 0 = swallow, 1 = pass to X-Plane
pick_pass_misses = 0
; 1 = log the click windows and hits to Log.txt
pick_debug = 0

[Installation]
; number of G5 units: 1 = one G5 (3D/G5.obj, attitude), 2 = a second G5 below
; (3D/G5_2.obj, attach it in Plane Maker too). Unit 2 uses laminar_g5_2 and
; laminar/g5_2/... for its screen device, commands and datarefs.
units = 2

[Configuration mode]
; Hold the knob while the unit powers up (or command laminar/g5/config_mode).
; Values changed there are saved in state_unit<n>.ini next to the scripts and
; override this file and settings.ini; delete that file to go back to these.
; Airspeed page, knots. Band limits 0 = the aircraft's own (acf):
vne = 0
vno = 0
vso = 0
vs1 = 0
vfe = 0
; V-speed flag R, red VMC line, blue VYSE line; 0 = not shown
vr = 0
vmc = 0
vyse = 0
; ground speed unit: -1 = same as airspeed, 0 kt, 1 mph, 2 km/h
gs_unit = -1
; attitude calibration (deg); the unit shows X-Plane's pitch / roll + these
pitch_cal = 0
roll_cal = 0
; 0 = no CDI / VDI (mechanical CDI / HSI on the navigator)
nav_data = 1
; vibration test: RMS acceleration (g) that is 100 % of the limit
vib_limit_g = 0.3
